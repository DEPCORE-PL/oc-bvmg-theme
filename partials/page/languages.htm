[sitePicker]
==
{% set activeCode = this.site.code ?: 'pl' %}
{% set alternatives = sitePicker.sites|filter(site => site.code != activeCode) %}
<div class="language-switch">
{% if alternatives|length %}
    {% for site in alternatives %}
        <span class="link"><a href="{{ site.url }}">{{ site.code|upper }}<img src="{{ ('assets/images/' ~ site.code ~ '.png')|theme }}" alt=""></a></span>
    {% endfor %}
{% elseif activeCode != 'en' %}
    <span class="link"><a href="{{ url('/en') }}">EN<img src="{{ 'assets/images/en.png'|theme }}" alt=""></a></span>
{% endif %}
</div>
