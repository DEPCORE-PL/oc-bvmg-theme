
<div class="blue-background">
    <div class="container">
        {{ section.description|raw }}
    </div>
</div>

<div class="gallery grid-four container">
    {% for image in section.images %}
        <a href="{{ image.image|media }}">
            <img
                src="{{ (image.thumb ?: image.image)|media }}"
                alt="{{ image.alt }}"
            >
        </a>
    {% endfor %}
</div>
