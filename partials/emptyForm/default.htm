{% set isEnglish = this.site.code == 'en' %}
<form data-request="{{ __SELF__ }}::onFormSubmit">
    {{ form_token() }}

    <div class="fieldset input">
        <p class="name">
            <label for="imie">{{ isEnglish ? 'Name' : 'Imię' }}<sup>*</sup></label>
            <span class="grid-half">
                <input type="text" name="imie" id="imie" required placeholder="{{ isEnglish ? 'Name*' : 'Imię*' }}">
                <input type="text" name="nazwisko" id="surname" required placeholder="{{ isEnglish ? 'surname*' : 'Nazwisko*' }}">
            </span>
        </p>
        <p>
            <label for="email">Email<sup>*</sup></label>
            <input type="email" name="email" id="email" required>
        </p>
        <p>
            <label for="telefon">{{ isEnglish ? 'Phone' : 'Telefon' }}<sup>*</sup></label>
            <input type="text" name="telefon" id="telefon" required placeholder="### ### ###">
        </p>
        <p>
            <label for="topic">{{ isEnglish ? 'Subject' : 'Temat' }}<sup>*</sup></label>
            <select name="temat" id="topic" required>
                <option value="zapytanie">{{ isEnglish ? 'Inquiry' : 'Zapytanie' }}</option>
                <option value="inne">{{ isEnglish ? 'Other' : 'Inne' }}</option>
                <option value="oferta">{{ isEnglish ? 'Offer' : 'Oferta' }}</option>
                <option value="wspolpraca">{{ isEnglish ? 'Cooperation' : 'Współpraca' }}</option>
            </select>
        </p>
    </div>

    <div class="fieldset input">
        <p>
            <label for="wiadomosc">{{ isEnglish ? 'Message' : 'Wiadomość' }}<sup>*</sup></label>
            <textarea name="wiadomosc" id="wiadomosc" cols="30" rows="10" required></textarea>
        </p>
    </div>

    <div class="fieldset checkbox">
        <p>
            <input type="checkbox" name="rodo" id="rodo" required>
            <label for="rodo">{{ content(isEnglish ? 'kontakt/rodo.en.htm' : 'kontakt/rodo.htm')|striptags|trim }}</label>
        </p>
        <p>
            <input type="checkbox" name="newsletter" id="newsletter">
            <label for="newsletter">{{ content(isEnglish ? 'kontakt/newsletter.en.htm' : 'kontakt/newsletter.htm')|striptags|trim }}</label>
        </p>
        <p>
            <input type="checkbox" name="sms" id="sms">
            <label for="sms">{{ content(isEnglish ? 'kontakt/sms.en.htm' : 'kontakt/sms.htm')|striptags|trim }}</label>
        </p>
        <p>
            <a href="{{ 'polityka-prywatnosci'|page }}">{{ isEnglish ? 'Here' : 'Tutaj' }}</a>
            {{ isEnglish ? 'you can read our privacy policy' : 'możesz zapoznać się z naszą polityką prywatności' }}
        </p>
    </div>
    <div class="submit">
        <button type="submit">{{ isEnglish ? 'send' : 'wyślij' }}</button>
    </div>
    <div id="{{ __SELF__ }}_forms_flash" role="status" aria-live="polite" style="margin-top: 20px;"></div>
    {% partial '@recaptcha' %}
</form>
